name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flyology-json-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: Parser / ${{ matrix.os }} / GNAT ${{ matrix.gnat }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        gnat: [13.2.2, 14.2.1, 15.3.1, 16.1.0]
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire and GNAT
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=${{ matrix.gnat }} gprbuild=26.0.1
          cache: true
      - name: Select exact Ada toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=${{ matrix.gnat }} \
            gprbuild=26.0.1
      - name: Test parser
        run: |
          if ! alr test; then
            cat alire/alr_test_local.log
            exit 1
          fi

  benchmark-adapters:
    name: Benchmark adapters / ${{ matrix.os }} / ${{ matrix.track }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        track: [portable, native]
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install Alire and GNAT
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1
          cache: true
      - name: Select exact Ada toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
      - name: Configure Flyology Alire index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git \
            --name=flyology --before=community
      # setup-alire currently installs Node 20 for its own implementation and
      # places it on PATH. Restore the reviewed benchmark runtime afterwards.
      - name: Install Node 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: benchmarks/comparison/package-lock.json
      - name: Install npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: Verify benchmark JavaScript toolchain
        run: |
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.17.0
      - name: Build and test benchmark competitors
        run: ./scripts/test-benchmark-competitors.sh "${{ matrix.track }}"
