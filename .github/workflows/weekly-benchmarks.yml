name: Weekly directional benchmarks

on:
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Directional / ${{ matrix.os }} / ${{ matrix.track }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        track: [portable, native]
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install Alire and GNAT
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1
          cache: true
      - name: Select exact Ada toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
      - name: Configure Flyology Alire index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git \
            --name=flyology --before=community
      # setup-alire currently installs Node 20 for its own implementation and
      # places it on PATH. Restore the reviewed benchmark runtime afterwards.
      - name: Install Node 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: benchmarks/comparison/package-lock.json
      - name: Install npm 11.17.0
        run: npm install --global npm@11.17.0
      - name: Verify benchmark JavaScript toolchain
        run: |
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.17.0
      - name: Run directional benchmark and adapter suite
        run: |
          output="$RUNNER_TEMP/flyology-json-${{ matrix.track }}"
          mkdir -p "$output"
          set +e
          ./scripts/run-weekly-benchmarks.sh "${{ matrix.track }}" "$output" \
            2>&1 | tee "$RUNNER_TEMP/weekly-benchmark.log"
          pipeline_status=("${PIPESTATUS[@]}")
          benchmark_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          finalization_status=0
          cp "$RUNNER_TEMP/weekly-benchmark.log" "$output/" || finalization_status=$?
          ./scripts/write-benchmark-manifest.sh "$output" || {
            helper_status=$?
            if [ "$finalization_status" -eq 0 ]; then
              finalization_status=$helper_status
            fi
          }
          if [ "$benchmark_status" -ne 0 ]; then
            if [ "$tee_status" -ne 0 ] || [ "$finalization_status" -ne 0 ]; then
              echo "benchmark failed; evidence finalization also failed" >&2
            fi
            exit "$benchmark_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            exit "$tee_status"
          fi
          exit "$finalization_status"
      - name: Upload raw directional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flyology-json-${{ matrix.os }}-${{ matrix.track }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flyology-json-${{ matrix.track }}
