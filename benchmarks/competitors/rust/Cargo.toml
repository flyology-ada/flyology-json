[package]
name = "flyology-json-rust-bench-adapters"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"

[lib]
crate-type = ["staticlib"]

[dependencies]
serde_json = "=1.0.151"
simd-json = "=0.18.1"
sonic-rs = "=0.5.8"

[profile.release]
lto = false
opt-level = 3
panic = "unwind"
